name: Bug report
description: Something in CleanAppCache does not work as described.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        **Do not open a public issue for data loss or security problems.** If the app deleted something it should not have, or you found a way to make it delete protected files, run with elevated rights or leak data, report it privately as described in [SECURITY.md](https://github.com/evgeniyov/CleanAppCache/security/policy).

  - type: input
    id: macos
    attributes:
      label: macOS version
      description: Find About This Mac in the Apple menu, or run `sw_vers`.
      placeholder: "e.g. macOS 15.3.1 (24D70)"
    validations:
      required: true

  - type: input
    id: mac
    attributes:
      label: Mac model and chip
      description: Run `sysctl hw.model` for the model identifier and check About This Mac for the chip.
      placeholder: "e.g. MacBook Air (Mac16,12), Apple M4"
    validations:
      required: true

  - type: dropdown
    id: source
    attributes:
      label: How did you get the app?
      options:
        - Built from source
        - Release download (DMG)
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Commit or release version
      description: Enter the output of `git rev-parse --short HEAD` for a source build, or the version tag for a release.
      placeholder: "e.g. 114c6a1 or v1.0.0"
    validations:
      required: true

  - type: dropdown
    id: language
    attributes:
      label: App language
      options:
        - English
        - Russian
    validations:
      required: true

  - type: dropdown
    id: fda
    attributes:
      label: Full Disk Access
      description: Is CleanAppCache allowed in System Settings > Privacy & Security > Full Disk Access?
      options:
        - "Yes"
        - "No"
        - Not sure
    validations:
      required: false

  - type: input
    id: screen
    attributes:
      label: Screen
      description: Where the problem happens.
      placeholder: "e.g. Large Files, Uninstaller > Leftovers, Monitor, menu-bar widget"
    validations:
      required: false

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open ...
        2. Click ...
        3. ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behaviour
      description: Include any error message shown by the app. Screenshots help.
    validations:
      required: true

  - type: dropdown
    id: unexpected-change
    attributes:
      label: Did the app delete or change anything you did not expect?
      description: If you lost files or the app changed a protected location, follow the SECURITY.md instructions linked at the top of this form.
      options:
        - "No"
        - Yes, describe below
    validations:
      required: true

  - type: textarea
    id: unexpected-details
    attributes:
      label: What was deleted or changed
      description: List the paths and the confirmation you saw. Say whether the app moved the items to the Trash or deleted them permanently. You can shorten your user name.
    validations:
      required: false

  - type: markdown
    attributes:
      value: |
        ### Incorrect sensor reading
        Fill this in only for a Monitor or menu bar reading (temperature, frequency, GPU load, power or fan). The app shows "—" when it cannot read a sensor.

  - type: textarea
    id: sensor
    attributes:
      label: Sensor comparison
      description: Name the reading and enter the values from CleanAppCache and a reference tool at the same moment. Name the tool, such as `powermetrics`, macmon or iStat Menus.
      placeholder: |
        Reading: CPU temperature
        CleanAppCache: 38 °C
        Reference (tool name): 52 °C
        Machine state: idle / under load
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Paste relevant lines from ~/Library/Logs/CleanAppCache. Remove anything you want to keep private before pasting.
      render: text
    validations:
      required: false
