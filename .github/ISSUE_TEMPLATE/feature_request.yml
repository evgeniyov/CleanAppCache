name: Feature request
description: Suggest a change or a feature.
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and what prevents you from doing it?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: Describe how the change should work. If it deletes files, say whether it should move them to the Trash or delete them permanently.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Describe other approaches or workarounds you tried.
    validations:
      required: false
